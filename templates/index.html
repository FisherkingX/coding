<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Chat Terminal | Secure Node Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <meta name="description" content="Secure, Peer-to-Peer Chat Application for Node-based WebRTC Environments">
    <meta name="author" content="System Architect">
</head>
<body>
    <div class="chat-app-wrapper" role="application">
        
        <header id="app-header" class="group-header" role="banner">
            <h2 id="room-display" class="room-identifier">ROOM: ...</h2>
            <div class="user-details-box">
                <span id="display-name" class="name-label"></span> | 
                <span id="display-id" class="id-label" style="color:#38bdf8;"></span>
            </div>
            <div class="online-status-bar">
                ONLINE MEMBERS: <span id="member-count">0</span>
            </div>
        </header>

        <section id="video-grid" class="video-grid-container" aria-label="Media Grid">
            <div id="local-container" class="video-box-element">
                <video id="local-video" autoplay muted playsinline></video>
                <button id="hangup-btn" class="btn-hangup" onclick="endCall()">HANG UP</button>
            </div>
        </section>

        <main id="chat-window" class="chat-feed-area" role="log"></main>

        <div id="request-modal" class="modal-overlay-custom" style="display:none;">
            <div class="modal-content-wrapper">
                <p id="modal-text" class="modal-message"></p>
                <div class="modal-actions-grid">
                    <button class="btn-action-accept" id="accept-btn">ACCEPT</button>
                    <button class="btn-action-reject" id="reject-btn">REJECT</button>
                </div>
            </div>
        </div>

        <footer class="footer-input-area" role="contentinfo">
            <div class="input-container-row">
                <input type="text" id="user-msg" placeholder="Type a secure message..." autocomplete="off">
                <button class="btn-send-main" onclick="sendMessage()">SEND</button>
            </div>
            <div class="control-grid-row">
                <button class="btn-ctrl" id="private-btn" onclick="startPrivateRequest()">🔒</button>
                <button class="btn-ctrl" id="mic-btn" onclick="toggleMic()">🎙️</button>
                <button class="btn-ctrl" id="cam-btn" onclick="toggleCam()">📷</button>
                <button class="btn-ctrl" onclick="document.getElementById('file-input').click()">📁</button>
                <button class="btn-ctrl" id="call-btn" onclick="startCallRequest()">📞</button>
                <button class="btn-ctrl-reject" onclick="location.reload()">EXIT</button>
            </div>
        </footer>
    </div>
    
    <input type="file" id="file-input" style="display:none;" onchange="sendFile()">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
