<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; margin: 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d1117; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #161b22; padding: 20px; border-radius: 10px; border: 1px solid #30363d; width: 80%; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-join { width: 100%; padding: 10px; background: #238636; border: none; color: white; font-weight: bold; cursor: pointer; }
        .controls { display: flex; gap: 5px; padding: 10px; background: #161b22; }
        .btn { padding: 10px; background: #30363d; border: none; color: white; flex: 1; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="setupModal" class="modal-overlay">
        <div class="modal-content">
            <h2>JOIN ROOM</h2>
            <input type="text" id="roomInput" placeholder="Room Name">
            <input type="text" id="nameInput" placeholder="Your Name">
            <button class="btn-join" onclick="startApp()">JOIN</button>
        </div>
    </div>
    
    <video id="local-video" autoplay muted playsinline style="width:100%; background:black;"></video>
    
    <div class="controls">
        <button class="btn" onclick="toggleMic()">🎙️</button>
        <button class="btn" onclick="toggleCam()">📷</button>
        <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
    </div>
    <input type="file" id="file-input" style="display:none;" onchange="sendFile()">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
