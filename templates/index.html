<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Chat Communication Suite</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background-color: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #setupModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-inner { background: #161b22; padding: 40px; border-radius: 16px; border: 1px solid #30363d; width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 16px; margin: 12px 0; background: #010409; border: 1px solid #30363d; color: white; border-radius: 8px; font-size: 16px; }
        .btn-main { width: 100%; padding: 16px; background: #238636; border: none; color: white; font-weight: 700; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #video-container { width: 100%; height: 35vh; background: #010409; border-bottom: 2px solid #30363d; }
        #local-video { width: 100%; height: 100%; object-fit: cover; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { background: #21262d; padding: 12px 16px; border-radius: 12px; max-width: 80%; align-self: flex-start; }
        .controls-bar { background: #161b22; padding: 15px; display: flex; gap: 8px; border-top: 1px solid #30363d; }
        .ctrl-btn { flex: 1; padding: 14px; background: #30363d; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 20px; transition: background 0.2s; }
        .ctrl-btn.muted { background: #8b0000; }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div id="setupModal" class="modal-inner-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; justify-content:center; align-items:center; z-index:2000;">
        <div class="modal-inner">
            <h2 style="margin-top:0;">SECURE SESSION</h2>
            <input type="text" id="roomInput" placeholder="Room ID">
            <input type="text" id="nameInput" placeholder="Username">
            <button class="btn-main" onclick="startApp()">JOIN SESSION</button>
        </div>
    </div>

    <div id="video-container">
        <video id="local-video" autoplay muted playsinline></video>
    </div>

    <div id="chat-window"></div>

    <form class="controls-bar" onsubmit="event.preventDefault(); sendMessage();">
        <input type="text" id="msgInput" placeholder="Message..." style="flex:2; margin:0;">
        <button type="submit" class="ctrl-btn" style="flex:0.5;">➤</button>
        <button type="button" class="ctrl-btn" id="lock-btn" onclick="togglePrivate()">🔒</button>
        <button type="button" class="ctrl-btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <button type="button" class="ctrl-btn" id="cam-btn" onclick="toggleCam()">📷</button>
        <button type="button" class="ctrl-btn" onclick="document.getElementById('file-input').click()">📁</button>
    </form>
    <input type="file" id="file-input" onchange="sendFile()">

    <script src="/static/script.js"></script>
</body>
</html>
