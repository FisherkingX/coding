<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed App</title>
    <style>
        body { margin:0; background:#0d1117; color:white; font-family:sans-serif; }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1117; display:flex; justify-content:center; align-items:center; z-index:999; }
        .box { background:#161b22; padding:20px; border-radius:10px; width:80%; border:1px solid #30363d; }
        input { width:100%; padding:15px; margin:10px 0; background:#0d1117; border:1px solid #30363d; color:white; border-radius:8px; box-sizing:border-box; }
        .btn-join { width:100%; padding:15px; background:#238636; border:none; color:white; font-weight:bold; border-radius:8px; }
        #local-video { width:100%; height:300px; background:black; object-fit:cover; }
        .controls { display:flex; padding:10px; gap:5px; background:#161b22; position:fixed; bottom:0; width:100%; box-sizing:border-box; }
        .btn { flex:1; padding:15px; background:#30363d; border:none; color:white; border-radius:5px; }
    </style>
</head>
<body>
    <div id="setupModal" class="modal">
        <div class="box">
            <h2>JOIN ROOM</h2>
            <input type="text" id="roomInput" placeholder="Room Name">
            <input type="text" id="nameInput" placeholder="Your Name">
            <button class="btn-join" onclick="startApp()">JOIN</button>
        </div>
    </div>
    <video id="local-video" autoplay muted playsinline></video>
    <div class="controls">
        <input type="text" id="msgInput" placeholder="Message..." style="flex:2;">
        <button class="btn" onclick="sendMessage()">SEND</button>
        <button class="btn" onclick="toggleMic()">🎙️</button>
        <button class="btn" onclick="toggleCam()">📷</button>
        <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
    </div>
    <input type="file" id="file-input" style="display:none;">
    <script src="/static/script.js"></script>
</body>
</html>
