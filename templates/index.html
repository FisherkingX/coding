<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Chat - Advanced Secure Messaging</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <meta name="description" content="Secure WebRTC Chat Application">
</head>
<body>
    <div class="chat-app">
        <header class="group-header">
            <h2 id="room-display">ROOM: ...</h2>
            <div class="user-info">
                <span id="display-name"></span> | <span id="display-id" style="color:#38bdf8;"></span>
            </div>
            <div class="member-stats">ONLINE: <span id="member-count">0</span></div>
        </header>

        <section id="video-grid" class="video-grid">
            <div id="local-container">
                <video id="local-video" autoplay muted playsinline></video>
                <button id="hangup-btn" class="btn reject" onclick="endCall()">HANG UP</button>
            </div>
        </section>

        <main id="chat-window"></main>

        <div id="request-modal" class="modal-overlay">
            <div class="modal-content">
                <p id="modal-text"></p>
                <button id="accept-btn">ACCEPT</button>
                <button id="reject-btn">REJECT</button>
            </div>
        </div>

        <footer class="input-area">
            <input type="text" id="user-msg" placeholder="Message...">
            <div class="button-row">
                <button class="btn" onclick="sendMessage()">SEND</button>
                <button class="btn" id="private-btn" onclick="startPrivateRequest()">🔒</button>
                <button class="btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
                <button class="btn" id="cam-btn" onclick="toggleCam()">📷</button>
                <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
                <button class="btn" onclick="startCallRequest()">📞</button>
                <button class="btn reject" onclick="location.reload()">EXIT</button>
            </div>
        </footer>
    </div>
    <input type="file" id="file-input" style="display:none;" onchange="sendFile()">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
