<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        body { margin:0; background:#0d1117; color:white; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
        #local-video { width:100%; height:30vh; object-fit:cover; background:black; }
        #chat-window { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
        .msg { background:#21262d; padding:10px; border-radius:8px; align-self:flex-start; }
        .controls { padding:10px; background:#161b22; display:flex; gap:5px; }
        .btn { padding:15px; background:#30363d; border:none; color:white; border-radius:5px; flex:1; }
        .btn.active { background:#8b0000 !important; }
        #setupModal { position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1117; z-index:9999; display:flex; justify-content:center; align-items:center; }
        .box { background:#161b22; padding:20px; width:80%; }
        input { width:100%; padding:15px; margin:5px 0; background:#010409; color:white; border:1px solid #30363d; }
    </style>
</head>
<body>
    <div id="setupModal">
        <div class="box">
            <input type="text" id="roomInput" placeholder="Room ID">
            <input type="text" id="nameInput" placeholder="Name">
            <button class="btn" style="background:#238636;" onclick="startApp()">CONNECT</button>
        </div>
    </div>
    <video id="local-video" autoplay muted playsinline></video>
    <div id="chat-window"></div>
    <div class="controls">
        <input type="text" id="msgInput" placeholder="Message..." style="flex:2;">
        <button class="btn" onclick="sendMessage()">SEND</button>
        <button class="btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <button class="btn" id="cam-btn" onclick="toggleCam()">📷</button>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
