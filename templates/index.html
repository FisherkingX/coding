<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Chat App</title>
    <style>
        body { margin: 0; background: #0d1117; color: white; font-family: sans-serif; overflow: hidden; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #161b22; padding: 30px; border-radius: 15px; width: 85%; max-width: 400px; border: 1px solid #30363d; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 8px; box-sizing: border-box; }
        button { padding: 15px; border-radius: 8px; border: none; background: #238636; color: white; font-weight: bold; cursor: pointer; }
        #local-video { width: 100%; height: 300px; object-fit: cover; background: black; }
        .controls { display: flex; gap: 10px; padding: 20px; background: #0d1117; position: fixed; bottom: 0; width: 100%; }
        #chat-window { height: calc(100vh - 400px); overflow-y: scroll; padding: 20px; }
    </style>
</head>
<body>
    <div id="setupModal" class="modal-overlay">
        <div class="modal-box">
            <h2>JOIN ROOM</h2>
            <input type="text" id="roomInput" placeholder="Room Name">
            <input type="text" id="nameInput" placeholder="Your Name">
            <button onclick="startApp()">JOIN</button>
        </div>
    </div>

    <video id="local-video" autoplay muted playsinline></video>
    <div id="chat-window"></div>

    <div class="controls">
        <input type="text" id="msgInput" placeholder="Message..." style="flex:2;">
        <button onclick="sendMessage()">SEND</button>
        <button onclick="togglePrivate()">🔒</button>
        <button onclick="toggleMic()">🎙️</button>
        <button onclick="toggleCam()">📷</button>
        <button onclick="document.getElementById('file-input').click()">📁</button>
    </div>
    <input type="file" id="file-input" style="display:none;" onchange="sendFile()">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
