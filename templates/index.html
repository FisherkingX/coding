<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        body { background: #0d1117; color: white; margin: 0; font-family: sans-serif; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .box { background: #161b22; padding: 25px; border-radius: 12px; width: 85%; max-width: 350px; border: 1px solid #30363d; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 8px; box-sizing: border-box; }
        .btn-join { width: 100%; padding: 14px; background: #58a6ff; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #local-video { width: 100%; height: 250px; background: black; object-fit: cover; }
        .controls { display: flex; gap: 8px; padding: 15px; }
        .btn { padding: 12px; background: #21262d; border: 1px solid #30363d; color: white; flex: 1; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="setupModal" class="modal">
        <div class="box">
            <h2 style="margin-top:0;">JOIN ROOM</h2>
            <input type="text" id="roomInput" placeholder="Room Name">
            <input type="text" id="nameInput" placeholder="Your Name">
            <button class="btn-join" onclick="startApp()">JOIN</button>
        </div>
    </div>

    <video id="local-video" autoplay muted playsinline></video>

    <div class="controls">
        <input type="text" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" onclick="sendMessage()">SEND</button>
        <button class="btn" onclick="togglePrivate()">🔒</button>
        <button class="btn" onclick="toggleMic()">🎙️</button>
        <button class="btn" onclick="toggleCam()">📷</button>
        <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
    </div>
    <input type="file" id="file-input" style="display:none;">
    
    <script src="/static/script.js"></script>
</body>
</html>
