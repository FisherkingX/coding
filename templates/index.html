<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Chat</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

</head>

<body>


<!-- JOIN SCREEN -->

<div id="join-screen" class="join-screen">

<div class="join-box">

<h1>Pro Chat</h1>

<input id="name-input" placeholder="Your Name">

<input id="room-input" placeholder="Room Name">

<button id="join-btn">JOIN ROOM</button>

</div>

</div>



<!-- CHAT APP -->

<div class="chat-app" style="display:none;">

<div class="group-header">

<h2 id="room-display">ROOM</h2>

<div class="user-info">
<span id="display-name"></span> |
<span id="display-id"></span>
</div>

<div class="member-stats">
ONLINE: <span id="member-count">0</span>
</div>

</div>



<div id="video-grid" class="video-grid">

<div id="local-container">

<video id="local-video" autoplay muted playsinline></video>

<button id="hangup-btn" onclick="endCall()" style="display:none;">
HANG UP
</button>

</div>

</div>



<div id="chat-window"></div>



<div class="input-area">

<input id="user-msg" placeholder="Type message">

<button onclick="sendMessage()">SEND</button>

<button id="private-btn" onclick="startPrivateRequest()">🔒</button>

<button id="mic-btn" onclick="toggleMic()">🎙</button>

<button id="cam-btn" onclick="toggleCam()">📷</button>

<button onclick="document.getElementById('file-input').click()">📁</button>

<button onclick="startCallRequest()">📞</button>

<button onclick="location.reload()">EXIT</button>

</div>


</div>


<input type="file" id="file-input" style="display:none;" onchange="sendFile()">



<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
