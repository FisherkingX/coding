<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="chat-app">
        <div class="group-header">
            <h2 id="room-display">ROOM: ...</h2>
            <div class="user-info">
                <span id="display-name"></span> | <span id="display-id" style="color:#38bdf8;"></span>
            </div>
            <div class="member-stats">ONLINE: <span id="member-count">0</span></div>
        </div>

        <div id="video-grid" class="video-grid">
            <div id="local-container" style="position:relative; flex-shrink:0;">
                <video id="local-video" autoplay muted playsinline></video>
                <button id="hangup-btn" class="btn reject" style="display:none; position:absolute; bottom:0; width:100%; height:25px; font-size:10px; z-index:10;" onclick="endCall()">HANG UP</button>
            </div>
        </div>

        <div id="chat-window"></div>

        <div id="session-modal" class="modal-overlay">
            <div class="modal-content" style="max-width: 300px;">
                <h2 style="margin-top:0; color:white;">SECURE SESSION</h2>
                <input type="text" id="room-input" placeholder="Room ID" style="width:100%; padding:10px; margin-bottom:10px; background:#0d1117; border:1px solid #38bdf8; color:white; border-radius:5px;">
                <input type="text" id="name-input" placeholder="Username" style="width:100%; padding:10px; margin-bottom:20px; background:#0d1117; border:1px solid #38bdf8; color:white; border-radius:5px;">
                <button class="btn send" onclick="joinSession()">JOIN SESSION</button>
            </div>
        </div>

        <div id="private-modal" class="modal-overlay" style="display:none;">
            <div class="modal-content" style="max-width: 300px;">
                <h2 style="margin-top:0; color:white;">PRIVATE CHAT</h2>
                <input type="text" id="target-id-input" placeholder="Enter Target ID" style="width:100%; padding:10px; margin-bottom:20px; background:#0d1117; border:1px solid #38bdf8; color:white; border-radius:5px;">
                <div class="modal-buttons">
                    <button class="btn send" onclick="confirmPrivate()">START</button>
                    <button class="btn reject" onclick="document.getElementById('private-modal').style.display='none'">CANCEL</button>
                </div>
            </div>
        </div>

        <div id="request-modal" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <p id="modal-text" style="color:white; font-weight:bold;"></p>
                <div class="modal-buttons">
                    <button class="btn send" id="accept-btn">ACCEPT</button>
                    <button class="btn reject" id="reject-btn">REJECT</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="user-msg" placeholder="Type message..." autocomplete="off">
                <div class="button-row">
                    <button class="btn send" onclick="sendMessage()">SEND</button>
                    <button class="btn" id="private-btn" onclick="startPrivateRequest()">🔒</button>
                    <button class="btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
                    <button class="btn" id="cam-btn" onclick="toggleCam()">📷</button>
                    <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
                    <button class="btn" id="call-btn" onclick="startCallRequest()">📞</button>
                    <button class="btn reject" onclick="location.reload()">EXIT</button>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="file-input" style="display:none;" onchange="sendFile()">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
