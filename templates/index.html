<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #0d1117; color: white; margin: 0; font-family: sans-serif; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1b26; padding: 25px; border-radius: 12px; width: 80%; border: 1px solid #44475a; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #24283b; border: 1px solid #44475a; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-join { width: 100%; padding: 12px; background: #7aa2f7; border: none; color: white; font-weight: bold; border-radius: 6px; }
        .input-area { display: flex; padding: 10px; gap: 5px; position: fixed; bottom: 0; width: 100%; background: #0d1117; }
        .btn { padding: 10px; background: #24283b; border: 1px solid #44475a; color: white; border-radius: 6px; flex: 1; }
    </style>
</head>
<body>
    <div class="chat-app">
        <h2 id="room-display" style="padding:10px;">ROOM: ...</h2>
        <div id="setupModal" class="modal-overlay">
            <div class="modal-content">
                <h2>JOIN ROOM</h2>
                <input type="text" id="roomInput" placeholder="Room Name">
                <input type="text" id="nameInput" placeholder="Your Name">
                <button class="btn-join" onclick="startApp()">JOIN</button>
            </div>
        </div>

        <video id="local-video" autoplay muted playsinline style="width:100%; max-height:200px; background:black;"></video>
        <div id="chat-window" style="padding:10px;"></div>

        <div class="input-area">
            <input type="text" id="user-msg" placeholder="Message...">
            <button class="btn" onclick="sendMessage()">SEND</button>
            <button class="btn" id="private-btn" onclick="togglePrivate()">🔒</button>
            <button class="btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
            <button class="btn" id="cam-btn" onclick="toggleCam()">📷</button>
            <button class="btn" onclick="document.getElementById('file-input').click()">📁</button>
        </div>
        <input type="file" id="file-input" style="display:none;" onchange="sendFile()">
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
