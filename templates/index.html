<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="setupModal">
        <div class="box">
            <input type="text" id="roomInput" placeholder="Room ID">
            <input type="text" id="nameInput" placeholder="Name">
            <button class="btn" onclick="startApp()">CONNECT</button>
        </div>
    </div>
    <div id="header">
        <span id="room-name">Room: --</span>
        <span id="online-count">Online: 0</span>
    </div>
    <video id="local-video" autoplay muted playsinline style="display:none;"></video>
    <div id="chat-window"></div>
    <div class="controls">
        <input type="text" id="msgInput" placeholder="Message...">
        <button class="btn" onclick="sendMessage()">SEND</button>
        <button class="btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <button class="btn" id="cam-btn" onclick="toggleCam()">📷</button>
        <button class="btn" id="file-btn" onclick="openFolder()">📁</button>
        <button class="btn" id="priv-btn" onclick="togglePrivate()">🔒</button>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
